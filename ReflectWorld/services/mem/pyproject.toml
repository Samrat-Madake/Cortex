[project]
name = "reflectworld-mem"
version = "1.0.0"
description = "ReflectWorld Memory Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]",
    "qdrant-client>=1.7",
    "openai>=1.0",
    "google-generativeai",
    "python-dotenv",
    "httpx",
    "pydantic>=2.0",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "qdrant: tests that require a writable Qdrant instance",
]
